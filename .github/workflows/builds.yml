name: Sync & Build

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * 1"   # weekly (every Monday at 00:00 UTC)

env:
  USE_HARD_LINKS: false

permissions:
  contents: write

jobs:
  sync_upstream:
    name: "Sync Upstream"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_WITH_WORKFLOW }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ferdium/ferdium-app
          git fetch upstream

      - name: Rebase onto upstream
        run: |
          git rebase upstream/develop || true
          while [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; do
            git checkout --ours electron-builder.yml 2>/dev/null || true
            git checkout --ours .github/workflows/builds.yml 2>/dev/null || true
            git add electron-builder.yml .github/workflows/builds.yml 2>/dev/null || true
            git -c core.editor=true rebase --continue || true
          done

      - name: Push updated branch
        run: |
          git push origin develop --force-with-lease

  build_linux:
    name: "Linux Build"
    runs-on: ubuntu-latest
    needs: sync_upstream

    steps:
      - name: Set env vars
        run: |
          echo "NPM_CACHE=$HOME/.npm" >> $GITHUB_ENV
          echo "ELECTRON_CACHE=$HOME/.cache/electron" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_CACHE=$HOME/.cache/electron-builder" >> $GITHUB_ENV

      - name: Checkout develop branch
        uses: actions/checkout@main
        with:
          ref: develop
          submodules: recursive
          fetch-depth: 0

      - name: Patch Linux Tray for Build
        run: |
          git checkout db8025b2 -- src/lib/Tray.ts src/lib/DBus.ts || true

      - name: Use Node.js
        uses: actions/setup-node@main
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@master

      # -----------------------------------------------------
      # Get Electron version from last release notes
      # -----------------------------------------------------
      - name: Get last release Electron version
        env:
          GH_TOKEN: ${{ github.token }}
        id: last_release
        run: |
          RESPONSE=$(gh api repos/Tomurisk/ferdium-custom-build/releases/latest 2>/dev/null || echo "{}")

          LAST_ELECTRON=$(echo "$RESPONSE" | grep -oP 'Electron:\s*\K[0-9]+\.[0-9]+\.[0-9]+' || echo "none")

          echo "LAST_ELECTRON=$LAST_ELECTRON" >> $GITHUB_ENV
          echo "Last release Electron: $LAST_ELECTRON"

      # -----------------------------------------------------
      # Check if Electron actually updated – skip if not
      # -----------------------------------------------------
      - name: Check Electron version
        id: check_electron
        run: |
          LATEST_ELECTRON=$(npm view electron version)
          echo "LATEST_ELECTRON=$LATEST_ELECTRON" >> $GITHUB_ENV

          echo "Latest Electron on npm:   $LATEST_ELECTRON"
          echo "Electron in last release: $LAST_ELECTRON"

          if [ "$LATEST_ELECTRON" = "$LAST_ELECTRON" ]; then
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
            echo "Electron unchanged – skipping build."
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
            echo "Electron updated – continuing."
          fi

      # -----------------------------------------------------
      # Stop early if no update
      # -----------------------------------------------------
      - name: Stop if no update
        if: env.SKIP_BUILD == 'true'
        run: echo "No new Electron version – exiting workflow."

      # -----------------------------------------------------
      # Only run the rest if Electron updated
      # -----------------------------------------------------
      - name: Bump Electron locally
        if: env.SKIP_BUILD != 'true'
        run: |
          jq --arg ver "$LATEST_ELECTRON" '.devDependencies.electron = $ver' package.json > package.tmp && mv package.tmp package.json
          pnpm install --lockfile-only

      - name: Install node dependencies
        if: env.SKIP_BUILD != 'true'
        uses: nick-fields/retry@master
        with:
          command: pnpm i
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error

      - name: Package recipes
        if: env.SKIP_BUILD != 'true'
        run: |
          pnpm i
          pnpm lint
          pnpm reformat-files
          pnpm package
        working-directory: ./recipes

      - name: Run linter and tests
        if: env.SKIP_BUILD != 'true'
        run: |
          pnpm lint
          pnpm test

      - name: Build Ferdium
        if: env.SKIP_BUILD != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm build --publish never

      # -------------------------------
      # Continuous Release Publishing
      # -------------------------------
      - name: Delete old continuous release and tag
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/Tomurisk/ferdium-custom-build"

          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$API/releases/tags/continuous" || true)

          RELEASE_ID=$(echo "$RESPONSE" | grep '"id":' | head -n1 | sed 's/[^0-9]*//g' || true)

          if [ -n "$RELEASE_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases/$RELEASE_ID" || true
          fi

          TAG_RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$API/git/refs/tags/continuous" || true)

          if echo "$TAG_RESPONSE" | grep -q '"ref":'; then
            curl -s -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$API/git/refs/tags/continuous" || true
          fi

      - name: Upload to Continuous Release
        if: env.SKIP_BUILD != 'true'
        uses: softprops/action-gh-release@master
        with:
          tag_name: continuous
          name: "Continuous Build"
          prerelease: false
          body: |
            Electron: ${{ env.LATEST_ELECTRON }}
          files: |
            out/Ferdium*.AppImage
            out/Ferdium*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
